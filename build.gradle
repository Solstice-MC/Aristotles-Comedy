plugins {
	id 'fabric-loom' version '1.10-SNAPSHOT'
}

base.archivesName = project.mod_id
version = project.mod_version
group = project.mod_group

repositories {
	mavenLocal()
	maven { url "https://dl.cloudsmith.io/public/solstice-mc/artifacts/maven/" }
}

loom {
	accessWidenerPath = file("src/main/resources/aristotles_comedy.accesswidener")
}

fabricApi {
	configureDataGeneration()
}

dependencies {
	minecraft "com.mojang:minecraft:$minecraft_version"
	mappings "net.fabricmc:yarn:$yarn_mappings:v2"
	modImplementation "net.fabricmc:fabric-loader:$loader_version"
	modImplementation "net.fabricmc.fabric-api:fabric-api:$fabric_version"
//	modImplementation "org.solstice.euclids-elements:euclids-elements:$euclids_elements_version"
	modImplementation "org.solstice.euclids-elements:euclids-base-api:1.0.0"
	modImplementation "org.solstice.euclids-elements:euclids-auto-datagen-api:1.0.0"
	modImplementation "org.solstice.euclids-elements:euclids-component-holder-api:1.0.0"
	modImplementation "org.solstice.euclids-elements:euclids-effect-holder-api:1.0.0"
//	modImplementation "org.solstice.euclids-elements:euclids-map-tag-api:1.0.0"
}

processResources {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	filesMatching("fabric.mod.json") {
		expand project.properties
	}
}
